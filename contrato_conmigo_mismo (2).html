<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contrato Conmigo Mismo — Diplomado ANDI Atlántico</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0A0F1E;--surface:#111827;--gold:#C9A84C;--gold-dim:#8A6D2A;
  --gold-light:#E8D5A3;--text:#EDE8DF;--muted:#7A8BA0;
  --border:rgba(201,168,76,0.25);--cream:#F7F2E8;--cream-dark:#EDE5D4;
  --ink:#1C1610;--ink-muted:#6B5E50;--danger:#E07070;
}
body{font-family:'Jost',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

.screen{display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:48px 24px;min-height:100vh}
.screen.active{display:flex;animation:appear 0.4s ease-out}
@keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* INTRO */
#s-intro{text-align:center}
.logos{display:flex;align-items:center;justify-content:center;gap:24px;margin-bottom:40px}
.logos img{height:38px;object-fit:contain;filter:brightness(0) invert(1);opacity:.8}
.logos .sep{width:1px;height:28px;background:var(--border)}
.eyebrow{font-size:11px;letter-spacing:4px;color:var(--muted);text-transform:uppercase;margin-bottom:28px}
.intro-title{font-family:'Cormorant Garamond',serif;font-size:clamp(32px,6vw,52px);
  font-weight:400;line-height:1.2;color:var(--gold);margin-bottom:20px}
.intro-sub{font-size:16px;color:var(--muted);line-height:1.9;margin-bottom:48px;font-style:italic}
.rule{width:40px;height:1px;background:var(--border);margin:0 auto 40px}

/* BUTTONS */
.btn{background:transparent;border:1px solid var(--gold);color:var(--gold);
  padding:13px 36px;font-size:13px;letter-spacing:3px;cursor:pointer;
  font-family:'Jost',sans-serif;font-weight:400;text-transform:uppercase;transition:all .3s}
.btn:hover{background:var(--gold);color:var(--bg)}
.btn:disabled{opacity:.3;cursor:not-allowed;pointer-events:none}
.btn-ghost{background:transparent;border:1px solid rgba(255,255,255,.15);color:var(--muted);
  padding:13px 28px;font-size:13px;letter-spacing:2px;cursor:pointer;
  font-family:'Jost',sans-serif;transition:all .3s}
.btn-ghost:hover{border-color:rgba(255,255,255,.3);color:var(--text)}

/* QUESTION */
#s-question{justify-content:flex-start;padding-top:40px}
.q-inner{max-width:640px;width:100%;margin:0 auto}
.prog{display:flex;gap:5px;margin-bottom:48px}
.prog-seg{height:2px;border-radius:1px;background:rgba(255,255,255,.1);transition:flex .4s,background .4s;flex:1}
.prog-seg.done{background:var(--gold)}
.prog-seg.active{background:var(--gold);flex:2}
.q-num{font-size:11px;letter-spacing:3px;color:var(--gold-dim);text-transform:uppercase;margin-bottom:10px}
.q-nota{font-size:13px;color:var(--muted);font-style:italic;margin-bottom:22px;line-height:1.7}
.q-text{font-family:'Cormorant Garamond',serif;font-size:clamp(22px,4vw,32px);
  font-weight:400;line-height:1.4;color:var(--text);margin-bottom:36px}
.txt-inp{width:100%;background:transparent;border:none;
  border-bottom:1px solid rgba(201,168,76,.4);color:var(--text);
  font-size:20px;font-family:'Cormorant Garamond',serif;padding:10px 0;
  outline:none;margin-bottom:4px;transition:border-color .3s}
.txt-inp:focus{border-bottom-color:var(--gold)}
.txt-inp::placeholder{color:var(--muted);font-style:italic}
.inp-underline{height:1.5px;background:var(--gold);width:0;transition:width .4s;margin-bottom:28px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:16px}
.opt{background:rgba(255,255,255,.03);border:1px solid rgba(201,168,76,.2);
  padding:14px 16px;text-align:left;cursor:pointer;transition:all .2s;font-family:'Jost',sans-serif;width:100%}
.opt:hover:not(.opt-disabled){border-color:rgba(201,168,76,.5);background:rgba(201,168,76,.06)}
.opt.opt-sel{border-color:var(--gold);background:rgba(201,168,76,.12)}
.opt.opt-disabled{opacity:.3;cursor:not-allowed}
.opt-label{font-size:14px;font-weight:500;color:var(--text);margin-bottom:4px}
.opt-sel .opt-label{color:var(--gold-light)}
.opt-desc{font-size:12px;color:var(--muted);line-height:1.4}
.opt-tag{font-size:10px;color:var(--muted);margin-left:6px;font-weight:400}
.err{font-size:13px;color:var(--danger);font-style:italic;margin-bottom:16px;min-height:20px}
.q-foot{margin-top:40px}

/* GENERATING */
#s-gen{text-align:center}
.spinner{width:34px;height:34px;border:1.5px solid rgba(201,168,76,.2);
  border-top-color:var(--gold);border-radius:50%;animation:spin 1.2s linear infinite;margin:0 auto 32px}
@keyframes spin{to{transform:rotate(360deg)}}
.gen-txt{font-size:14px;color:var(--muted);letter-spacing:1px;font-style:italic}

/* CONTRACT */
#s-contract{background:var(--cream);color:var(--ink);
  padding:60px 24px 80px;justify-content:flex-start}
.ci{max-width:640px;width:100%;margin:0 auto}
.c-logos{display:flex;align-items:center;justify-content:center;gap:24px;margin-bottom:36px}
.c-logos img{height:34px;object-fit:contain}
.c-logos .sep{width:1px;height:24px;background:var(--cream-dark)}
.c-hdr{text-align:center;margin-bottom:40px}
.c-eyebrow{font-size:10px;letter-spacing:4px;color:var(--ink-muted);text-transform:uppercase;margin-bottom:16px}
.c-title{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:500;
  letter-spacing:4px;color:var(--ink);text-transform:uppercase;margin-bottom:10px}
.c-name{font-size:15px;color:var(--ink-muted)}
.c-subtitle{font-size:12px;color:var(--ink-muted);margin-top:4px}
.c-rule{height:1px;background:var(--ink);opacity:.15;margin-bottom:40px}
.c-rule-thin{height:1px;background:var(--ink);opacity:.07;margin-bottom:40px}
.c-body{font-family:'Cormorant Garamond',serif;font-size:18px;
  line-height:2.1;color:var(--ink);white-space:pre-wrap;margin-bottom:56px}
.sig-row{display:grid;grid-template-columns:1fr 1fr;gap:48px;margin-bottom:48px}
.sig-line{height:44px;border-bottom:1px solid rgba(28,22,16,.25);margin-bottom:8px;
  display:flex;align-items:flex-end;padding-bottom:8px}
.sig-date-txt{font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:14px;color:var(--ink-muted)}
.sig-lbl{font-size:10px;letter-spacing:3px;color:var(--ink-muted);text-transform:uppercase}
.c-ftr{text-align:center;padding-top:24px;border-top:1px solid rgba(28,22,16,.08);margin-bottom:40px}
.c-ftr-logos{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:12px}
.c-ftr-logos img{height:24px;object-fit:contain;opacity:.45}
.c-ftr-logos .sep{width:1px;height:18px;background:rgba(28,22,16,.15)}
.c-ftr-txt{font-size:10px;letter-spacing:3px;color:var(--ink-muted);text-transform:uppercase}
.c-actions{display:flex;gap:12px;justify-content:center}
.btn-print{background:var(--ink);border:none;color:var(--cream);padding:13px 32px;
  font-size:12px;letter-spacing:3px;cursor:pointer;font-family:'Jost',sans-serif;
  text-transform:uppercase;transition:opacity .2s}
.btn-print:hover{opacity:.8}
.btn-reset{background:transparent;border:1px solid rgba(28,22,16,.2);color:var(--ink-muted);
  padding:13px 24px;font-size:12px;letter-spacing:2px;cursor:pointer;
  font-family:'Jost',sans-serif;transition:all .2s}
.btn-reset:hover{border-color:rgba(28,22,16,.4);color:var(--ink)}

@media print{.c-actions,.no-print{display:none!important}#s-contract{padding:40px 32px}body{background:#fff}}
@media(max-width:480px){.opts{grid-template-columns:1fr}.sig-row{grid-template-columns:1fr;gap:28px}}
</style>
</head>
<body>

<div class="screen active" id="s-intro">
  <div class="logos">
    <img src="https://lobbymap.org/site//data/001/361/1361294.png" alt="ANDI" onerror="this.style.display='none'">
    <div class="sep"></div>
    <img src="https://www.uninorte.edu.co/documents/13865921/0/image_gallery+%281%29.jpg" alt="Uninorte" onerror="this.style.display='none'">
  </div>
  <p class="eyebrow">Storytelling &amp; Presentaciones de Alto Impacto</p>
  <h1 class="intro-title">Contrato<br>conmigo mismo</h1>
  <p class="intro-sub">Diez preguntas. Sin respuestas correctas.<br>Solo honestidad.</p>
  <div class="rule"></div>
  <button class="btn" onclick="startQuiz()">Comenzar →</button>
</div>

<div class="screen" id="s-question">
  <div class="q-inner">
    <div class="prog" id="prog"></div>
    <p class="q-num" id="q-num"></p>
    <p class="q-nota" id="q-nota"></p>
    <h2 class="q-text" id="q-text"></h2>
    <div id="q-area"></div>
    <p class="err" id="q-err"></p>
    <div class="q-foot">
      <button class="btn" id="btn-next" onclick="advance()">Continuar →</button>
    </div>
  </div>
</div>

<div class="screen" id="s-gen">
  <div class="spinner"></div>
  <p class="gen-txt" id="gen-txt">Leyendo tus respuestas...</p>
</div>

<div class="screen" id="s-contract">
  <div class="ci">
    <div class="c-logos">
      <img src="https://lobbymap.org/site//data/001/361/1361294.png" alt="ANDI" onerror="this.style.display='none'">
      <div class="sep"></div>
      <img src="https://www.uninorte.edu.co/documents/13865921/0/image_gallery+%281%29.jpg" alt="Uninorte" onerror="this.style.display='none'">
    </div>
    <div class="c-hdr">
      <p class="c-eyebrow" id="c-eyebrow"></p>
      <h1 class="c-title">Contrato conmigo mismo</h1>
      <p class="c-name" id="c-name"></p>
      <p class="c-subtitle">Storytelling &amp; Presentaciones de Alto Impacto</p>
    </div>
    <div class="c-rule"></div>
    <div class="c-body" id="c-body"></div>
    <div class="c-rule-thin"></div>
    <div class="sig-row">
      <div>
        <div class="sig-line"></div>
        <p class="sig-lbl">Firma</p>
      </div>
      <div>
        <div class="sig-line"><span class="sig-date-txt" id="sig-date"></span></div>
        <p class="sig-lbl">Fecha</p>
      </div>
    </div>
    <div class="c-ftr">
      <div class="c-ftr-logos">
        <img src="https://lobbymap.org/site//data/001/361/1361294.png" alt="ANDI" onerror="this.style.display='none'">
        <div class="sep"></div>
        <img src="https://www.uninorte.edu.co/documents/13865921/0/image_gallery+%281%29.jpg" alt="Uninorte" onerror="this.style.display='none'">
      </div>
      <p class="c-ftr-txt">Diplomado ANDI Atlántico · Universidad del Norte</p>
    </div>
    <div class="c-actions no-print">
      <button class="btn-print" onclick="abrirParaImprimir()">⎙ Imprimir / Guardar PDF</button>
      <button class="btn-reset" onclick="resetAll()">Nuevo contrato</button>
    </div>
  </div>
</div>

<script>
const DIMS = [
  {v:"Historia",d:"Estructura narrativa con protagonista y conflicto"},
  {v:"Significado",d:"Conectar el mensaje con valores profundos"},
  {v:"Ritual",d:"Crear momentos de conexión emocional"},
  {v:"Transmedia",d:"Coherencia narrativa en múltiples canales"},
];

const QS = [
  {id:"nombre",    type:"text",  num:"01", nota:"Este espacio es para ti. No hay respuestas correctas.",
   q:"¿Cuál es tu nombre?", ph:"Escribe tu nombre..."},
  {id:"genero",    type:"sel",   num:"02", nota:"Esto nos ayuda a redactar el contrato en el lenguaje que mejor te representa.",
   q:"¿Con cuál de estas opciones te identificas?",
   ops:[{v:"Masculino",d:"Redacción en género masculino"},{v:"Femenino",d:"Redacción en género femenino"},{v:"No binario",d:"Redacción en lenguaje neutro"}]},
  {id:"arquetipo", type:"sel",   num:"03", nota:"No el que quisieras ser — el que eres hoy.",
   q:"¿Con cuál arquetipo te identificas hoy como comunicador?",
   ops:[{v:"El Héroe",d:"Inspirar con superación y logro"},{v:"El Sabio",d:"Educar, analizar, estructurar"},
        {v:"El Creador",d:"Imaginar, proponer, innovar"},{v:"El Cuidador",d:"Conectar desde la empatía"},
        {v:"El Forajido",d:"Cuestionar y transformar"},{v:"El Mago",d:"Catalizar el cambio"}]},
  {id:"dim_facil", type:"sel",   num:"04", nota:"La fortaleza que ya tienes — no la que más necesitas trabajar.",
   q:"¿Cuál dimensión del modelo Zimand-Sheiner te sale más naturalmente?", ops:DIMS},
  {id:"dim_dificil",type:"sel",  num:"05", nota:"El área de crecimiento es tan valiosa como la fortaleza.",
   q:"¿Cuál dimensión descubriste que te resulta más difícil o necesitas trabajar más?", ops:DIMS},
  {id:"incomodidad",type:"text", num:"06", nota:"Donde hubo incomodidad, hubo crecimiento.",
   q:"¿Cuál fue el momento del diplomado donde más te incomodaste?", ph:"Descríbelo con honestidad..."},
  {id:"cambio",    type:"text",  num:"07", nota:"Las transformaciones grandes empiezan con actos pequeños.",
   q:"¿Qué acción concreta vas a cambiar en tu comunicación esta semana?", ph:"Una sola cosa, específica y accionable..."},
  {id:"compromiso",type:"text",  num:"08", nota:"Un compromiso sostenido vale más que diez intenciones.",
   q:"¿A qué te comprometes a seguir trabajando en tu comunicación más allá de esta semana?", ph:"Un hábito, una práctica, una meta..."},
  {id:"persona",   type:"text",  num:"09", nota:"Enseñar es la forma más poderosa de consolidar un aprendizaje.",
   q:"¿A quién le vas a contar lo que aprendiste aquí?", ph:"Un nombre, un equipo, una audiencia..."},
  {id:"palabra",   type:"text",  num:"10", nota:"No la que quisieras ser. La que eres.",
   q:"En una sola palabra: ¿qué eres como comunicador/a hoy?", ph:"Una palabra..."},
];

const TOTAL = QS.length;
const GEN = ["Leyendo tus respuestas...","Encontrando las palabras correctas...","Escribiendo tu contrato...","Dando los últimos toques..."];

let qi=0, ans={}, curSel=null, genIv=null, genIdx=0;

function goTo(id){
  document.querySelectorAll('.screen').forEach(s=>{
    s.classList.remove('active');
  });
  const el = document.getElementById(id);
  el.classList.add('active');
  el.scrollTop = 0;
}

function startQuiz(){qi=0;ans={};curSel=null;goTo('s-question');renderQ();}

function renderQ(){
  const q = QS[qi];
  curSel = null;

  // progress
  document.getElementById('prog').innerHTML =
    QS.map((_,i)=>`<div class="prog-seg ${i<qi?'done':i===qi?'active':''}"></div>`).join('');

  document.getElementById('q-num').textContent  = q.num+' — '+String(TOTAL).padStart(2,'0');
  document.getElementById('q-nota').textContent = q.nota;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('q-err').textContent  = '';

  const btn = document.getElementById('btn-next');
  btn.textContent = qi < TOTAL-1 ? 'Continuar →' : 'Generar contrato →';
  btn.disabled = true;

  const area = document.getElementById('q-area');

  if(q.type==='text'){
    area.innerHTML =
      `<input class="txt-inp" id="txt" placeholder="${q.ph}"><div class="inp-underline" id="uline"></div>`;
    const inp = document.getElementById('txt');
    inp.addEventListener('input',()=>{
      document.getElementById('uline').style.width = inp.value.trim()?'100%':'0';
      btn.disabled = !inp.value.trim();
    });
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&inp.value.trim())advance();});
    setTimeout(()=>inp.focus(),100);
  } else {
    const fortaleza = ans['dim_facil']||'';
    area.innerHTML = `<div class="opts">${q.ops.map(op=>{
      const blocked = q.id==='dim_dificil' && op.v===fortaleza;
      return `<button class="opt${blocked?' opt-disabled':''}" data-val="${op.v}"
        onclick="pickOpt(this,'${op.v}','${q.id}','${fortaleza}')">
        <div class="opt-label">${op.v}${blocked?'<span class="opt-tag">(tu fortaleza)</span>':''}</div>
        <div class="opt-desc">${op.d}</div>
      </button>`;
    }).join('')}</div>`;
  }
}

function pickOpt(el,val,qid,fortaleza){
  if(qid==='dim_dificil'&&val===fortaleza){
    document.getElementById('q-err').textContent='Elige una dimensión diferente a tu fortaleza.';
    return;
  }
  document.querySelectorAll('.opt').forEach(o=>o.classList.remove('opt-sel'));
  el.classList.add('opt-sel');
  curSel=val;
  document.getElementById('q-err').textContent='';
  document.getElementById('btn-next').disabled=false;
}

function advance(){
  const q = QS[qi];
  const val = q.type==='sel' ? curSel : (document.getElementById('txt')?.value?.trim()||'');
  if(!val) return;
  ans[q.id]=val;
  if(qi<TOTAL-1){qi++;goTo('s-question');renderQ();}
  else{goTo('s-gen');startGen();}
}

function startGen(){
  genIdx=0;
  document.getElementById('gen-txt').textContent=GEN[0];
  genIv=setInterval(()=>{
    genIdx=(genIdx+1)%GEN.length;
    document.getElementById('gen-txt').textContent=GEN[genIdx];
  },1800);
  genContract();
}

function stripMd(text){
  return text
    .replace(/^#{1,6}\s+/gm,'')
    .replace(/\*\*([^*]+)\*\*/g,'$1')
    .replace(/__([^_]+)__/g,'$1')
    .replace(/\*([^*\n]+)\*/g,'$1')
    .replace(/_([^_\n]+)_/g,'$1')
    .replace(/^[-*]{3,}$/gm,'')
    .replace(/^>\s+/gm,'')
    .replace(/\n{3,}/g,'\n\n')
    .trim();
}

function genContratoLocal(a){
  const g = a.genero || 'Masculino';
  const f = (m,fe,nb) => g==='Femenino'?fe:g==='No binario'?nb:m;

  const comunicador  = f('comunicador','comunicadora','comunicadore');
  const comprometido = f('comprometido','comprometida','comprometide');
  const consciente   = 'consciente';

  const arqDesc = {
    'El Héroe':     `${comunicador} que inspira desde la superación y el esfuerzo`,
    'El Sabio':     `${comunicador} que construye desde el conocimiento y el análisis`,
    'El Creador':   `${comunicador} que propone desde la imaginación y la originalidad`,
    'El Cuidador':  `${comunicador} que conecta desde la empatía y el servicio`,
    'El Forajido':  `${comunicador} que transforma desde el cuestionamiento honesto`,
    'El Mago':      `${comunicador} que cataliza el cambio en quienes le escuchan`,
    'El Gobernante':`${comunicador} que lidera desde la estructura y la claridad`,
    'El Explorador':`${comunicador} que descubre y comparte desde la curiosidad`,
  };

  const dimFacil = {
    'Historia':   'construir narrativas con estructura, protagonistas y conflicto claro',
    'Significado':'conectar mis mensajes con valores y propósitos profundos',
    'Ritual':     'crear momentos de conexión emocional genuina con mi audiencia',
    'Transmedia': 'mantener coherencia narrativa a través de múltiples canales',
  };

  const dimDificil = {
    'Historia':   'estructurar mis historias con más tensión narrativa y protagonistas definidos',
    'Significado':'conectar mis mensajes con un propósito más profundo y explícito',
    'Ritual':     'construir momentos de conexión emocional más genuinos y deliberados',
    'Transmedia': 'mantener un hilo narrativo coherente en todos mis canales de comunicación',
  };

  const arqCierre = {
    'El Héroe':     'la valentía de mostrarme tal como soy',
    'El Sabio':     'la profundidad de lo que sé y la honestidad de compartirlo',
    'El Creador':   'la originalidad de una voz que solo yo puedo tener',
    'El Cuidador':  'la calidez con la que me conecto con quienes me escuchan',
    'El Forajido':  'la honestidad radical que me distingue',
    'El Mago':      'la capacidad de transformar lo que toco con mis palabras',
    'El Gobernante':'la claridad y la presencia con la que lidero cada conversación',
    'El Explorador':'la curiosidad genuina que hace que valga la pena escucharme',
  };

  const arq = a.arquetipo || 'El Héroe';
  const cap = s => s ? s.charAt(0).toUpperCase()+s.slice(1).replace(/\.$/,'') : '';

  const p1 = `Termino este diplomado más ${consciente} de cómo me comunico que cuando llegué. Soy ${arqDesc[arq]||comunicador}, y mi mayor fortaleza narrativa está en ${dimFacil[a.dim_facil]||a.dim_facil}. La palabra que me define hoy es "${a.palabra}" — y asumo todo lo que eso implica.`;

  const p2 = `Me comprometo a:\n— ${cap(a.cambio)}.\n— Compartir lo que aprendí con ${a.persona}, porque enseñar es la forma más honesta de consolidar un aprendizaje.\n— ${cap(dimDificil[a.dim_dificil]||a.dim_dificil)}.`;

  const p3 = `${cap(a.incomodidad)} fue el momento más incómodo de este proceso. No lo minimizo: fue exactamente ahí donde ocurrió el aprendizaje real.`;

  const palabra = cap(a.palabra);
  const p4 = `"${palabra}" no es solo una palabra — es un punto de partida. Desde hoy, me comunico desde ${arqCierre[arq]||'todo lo que aprendí aquí'}.`;

  return [p1,p2,p3,p4].join('\n\n');
}

function genContract(){
  setTimeout(()=>{
    clearInterval(genIv);
    const texto = genContratoLocal(ans);
    showContract(stripMd(texto));
  }, 2500);
}

function showContract(text){
  const today=new Date().toLocaleDateString('es-CO',{year:'numeric',month:'long',day:'numeric'});
  const titulo = ans.genero==='Femenino' ? 'Contrato conmigo misma'
               : ans.genero==='No binario' ? 'Contrato conmigo misme'
               : 'Contrato conmigo mismo';
  document.querySelector('#s-contract .c-title').textContent = titulo;
  document.getElementById('c-eyebrow').textContent=`Diplomado ANDI Atlántico · ${new Date().getFullYear()}`;
  document.getElementById('c-name').textContent=ans.nombre;
  document.getElementById('c-body').textContent=text;
  document.getElementById('sig-date').textContent=today;
  goTo('s-contract');
}

function resetAll(){qi=0;ans={};curSel=null;goTo('s-intro');}

function abrirParaImprimir(){
  const name  = document.getElementById('c-name').textContent;
  const body  = document.getElementById('c-body').textContent;
  const date  = document.getElementById('sig-date').textContent;
  const year  = new Date().getFullYear();
  const titulo = ans.genero==='Femenino' ? 'Contrato conmigo misma'
               : ans.genero==='No binario' ? 'Contrato conmigo misme'
               : 'Contrato conmigo mismo';

  const logoAndi = 'https://lobbymap.org/site//data/001/361/1361294.png';
  const logoUni  = 'https://www.uninorte.edu.co/documents/13865921/0/image_gallery+%281%29.jpg';

  const escaped = body.replace(/</g,'&lt;').replace(/>/g,'&gt;');

  const html = `<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Contrato Conmigo Mismo — ${name}</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Jost',sans-serif;background:#F7F2E8;color:#1C1610;
    padding:60px 48px 80px;max-width:720px;margin:0 auto}
  .logos{display:flex;align-items:center;justify-content:center;gap:24px;margin-bottom:36px}
  .logos img{height:34px;object-fit:contain}
  .logos .sep{width:1px;height:24px;background:#EDE5D4}
  .hdr{text-align:center;margin-bottom:40px}
  .eyebrow{font-size:10px;letter-spacing:4px;color:#6B5E50;text-transform:uppercase;margin-bottom:16px}
  h1{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:500;
    letter-spacing:4px;text-transform:uppercase;margin-bottom:10px}
  .nombre{font-size:15px;color:#6B5E50}
  .subtitulo{font-size:12px;color:#6B5E50;margin-top:4px}
  .rule{height:1px;background:rgba(28,22,16,.15);margin-bottom:40px}
  .rule-thin{height:1px;background:rgba(28,22,16,.07);margin-bottom:40px}
  .cuerpo{font-family:'Cormorant Garamond',serif;font-size:18px;line-height:2.1;
    white-space:pre-wrap;margin-bottom:56px}
  .sigs{display:grid;grid-template-columns:1fr 1fr;gap:48px;margin-bottom:48px}
  .sig-line{height:44px;border-bottom:1px solid rgba(28,22,16,.25);margin-bottom:8px;
    display:flex;align-items:flex-end;padding-bottom:8px}
  .sig-date{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14px;color:#6B5E50}
  .sig-lbl{font-size:10px;letter-spacing:3px;color:#6B5E50;text-transform:uppercase}
  .ftr{text-align:center;padding-top:24px;border-top:1px solid rgba(28,22,16,.08)}
  .ftr-logos{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:12px}
  .ftr-logos img{height:22px;object-fit:contain;opacity:.45}
  .ftr-logos .sep{width:1px;height:16px;background:rgba(28,22,16,.15)}
  .ftr-txt{font-size:10px;letter-spacing:3px;color:#6B5E50;text-transform:uppercase}
  @media print{body{padding:40px 48px}}
</style>
</head>
<body>
  <div class="logos">
    <img src="${logoAndi}" alt="ANDI" onerror="this.style.display='none'">
    <div class="sep"></div>
    <img src="${logoUni}" alt="Uninorte" onerror="this.style.display='none'">
  </div>
  <div class="hdr">
    <p class="eyebrow">Diplomado ANDI Atlántico · ${year}</p>
    <h1>${titulo}</h1>
    <p class="nombre">${name}</p>
    <p class="subtitulo">Storytelling &amp; Presentaciones de Alto Impacto</p>
  </div>
  <div class="rule"></div>
  <div class="cuerpo">${escaped}</div>
  <div class="rule-thin"></div>
  <div class="sigs">
    <div>
      <div class="sig-line"></div>
      <p class="sig-lbl">Firma</p>
    </div>
    <div>
      <div class="sig-line"><span class="sig-date">${date}</span></div>
      <p class="sig-lbl">Fecha</p>
    </div>
  </div>
  <div class="ftr">
    <div class="ftr-logos">
      <img src="${logoAndi}" alt="ANDI" onerror="this.style.display='none'">
      <div class="sep"></div>
      <img src="${logoUni}" alt="Uninorte" onerror="this.style.display='none'">
    </div>
    <p class="ftr-txt">Diplomado ANDI Atlántico · Universidad del Norte</p>
  </div>
</body>
</html>`;

  const w = window.open('','_blank');
  if(!w){
    alert('Tu navegador bloqueó la ventana emergente. Por favor permite las ventanas emergentes para este sitio e intenta de nuevo.');
    return;
  }
  w.document.write(html);
  w.document.close();
  // Esperar a que cargue fuentes e imágenes antes de imprimir
  setTimeout(()=>{
    try{ w.focus(); w.print(); }catch(e){ console.warn('Print error:',e); }
  }, 1200);
}
</script>
</body>
</html>
